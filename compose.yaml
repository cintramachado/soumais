services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configure the local public origin}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Supabase publishable key is required}
        NEXT_PUBLIC_SUPABASE_COOKIE_NAME: sb-soulmais-auth-token
        SUPABASE_URL_INTERNAL: ${SUPABASE_URL_INTERNAL:-http://host.docker.internal:54321}
        SUPABASE_PROXY_PATHS: "true"
    ports:
      - "3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Configure the public app origin}
      NEXT_PUBLIC_SUPABASE_COOKIE_NAME: sb-soulmais-auth-token
      SUPABASE_URL_INTERNAL: ${SUPABASE_URL_INTERNAL:-http://host.docker.internal:54321}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Supabase secret key is required}
      SOULMAIS_EMAIL_DELIVERY_MODE: direct
      SOULMAIS_SMTP_USER: ${SOULMAIS_SMTP_USER:-soulmaisespacoalpha@gmail.com}
      SOULMAIS_GMAIL_APP_PASSWORD: ${SOULMAIS_GMAIL_APP_PASSWORD:?Gmail app password is required}
      NODE_USE_SYSTEM_CA: "1"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3