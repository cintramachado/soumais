services:
  web:
    build:
      context: ${SOULMAIS_WEB_DIR:?Set SOULMAIS_WEB_DIR}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set public app URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Supabase publishable key is required}
        NEXT_PUBLIC_SUPABASE_COOKIE_NAME: sb-soulmais-auth-token
        SUPABASE_URL_INTERNAL: ${SUPABASE_URL_INTERNAL:-http://127.0.0.1:54321}
        SUPABASE_PROXY_PATHS: "true"
    network_mode: host
    restart: unless-stopped
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3002"]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3002"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set public app URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set public app URL}
      NEXT_PUBLIC_SUPABASE_COOKIE_NAME: sb-soulmais-auth-token
      SUPABASE_URL_INTERNAL: ${SUPABASE_URL_INTERNAL:-http://127.0.0.1:54321}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Supabase secret key is required}
      SOULMAIS_EMAIL_DELIVERY_MODE: direct
      SOULMAIS_SMTP_USER: ${SOULMAIS_SMTP_USER:-soulmaisespacoalpha@gmail.com}
      SOULMAIS_GMAIL_APP_PASSWORD: ${SOULMAIS_GMAIL_APP_PASSWORD:?Gmail app password is required}
      NODE_USE_SYSTEM_CA: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3